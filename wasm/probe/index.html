<!doctype html>
<meta charset="utf-8">
<title>PHP 4 WASM probe</title>
<pre id="out"></pre>
<script src="php.js"></script>
<script>
(async () => {
  const lines = [];
  const php = await createPhp({ print: t => lines.push(t), printErr: t => lines.push('ERR ' + t) });
  const copy = async (url, target) => {
    php.FS.writeFile(target, new Uint8Array(await (await fetch(url)).arrayBuffer()));
  };
  php.FS.mkdirTree('/typo3/t3lib');
  await copy('t3lib/class.t3lib_div.php', '/typo3/t3lib/class.t3lib_div.php');
  await copy('t3lib/class.t3lib_tsparser.php', '/typo3/t3lib/class.t3lib_tsparser.php');
  await copy('typoscript.php', '/typoscript.php');
  php.callMain(['-n', '-d', 'error_reporting=2039', '/typoscript.php', '/typo3']);
  document.getElementById('out').textContent = lines.join('\n');
  window.probeOutput = lines;
})();
</script>
