; PHP 5.6 settings for the TYPO3 3.8.1 container.
;
; 3.8.1 is a 2005 codebase: 458 ereg() calls, 80 split() calls and 80 mysql_*
; calls across core. All of them still work on 5.6 — they were removed in 7.0,
; not 5.6 — but each one emits E_DEPRECATED. Left unsuppressed, PHP writes
; deprecation notices into the HTML output and they end up baked into every
; rendered page.
;
; Suppressing display is therefore a fidelity requirement, not a
; convenience. Logging stays on so real errors remain diagnosable.
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT & ~E_NOTICE
display_errors = Off
display_startup_errors = Off
log_errors = On
; To the container log rather than a file inside the container: a stack is
; torn down with `down -v` between runs, so a log file would be thrown away
; unread, and `docker compose logs` is where a failing run is actually diagnosed
; — including by the CI smoke test's own failure step.
error_log = /dev/stderr

; 3.8-era backends assume ISO-8859-1. Forcing it here keeps the container
; consistent with the database charset set in compose.yaml; t3lib_db never
; issues SET NAMES, so the two must be aligned by configuration.
default_charset = "ISO-8859-1"

; The Extension Manager and Install Tool do slow synchronous work on old cores.
max_execution_time = 300
memory_limit = 256M

; No mail from a container.
sendmail_path = /bin/true

; Deterministic session handling — session ids leak into rendered URLs otherwise.
session.use_cookies = 1
session.use_only_cookies = 1
session.use_trans_sid = 0

date.timezone = "UTC"
