# Apache policy for the TYPO3 3.8.1 container.
#
# The rules are a port of php4-base/nginx.conf, which serves the same
# purpose for the PHP 4 stacks. 3.8 runs under mod_php on the official
# php:5.6-apache image rather than nginx plus FastCGI, so the deny rules have to
# be restated in Apache's syntax — but the policy is deliberately identical, so a
# file cannot be protected on one stack and exposed on the other.
#
# What is *not* here is as telling as what is: nginx needs a PATH_TRANSLATED
# fixup to make TYPO3 3.x resolve PATH_site under FastCGI. mod_php reports the
# SAPI as "apache2handler", so typo3/init.php:72 takes its $_SERVER
# ['SCRIPT_FILENAME'] branch and the problem does not arise.

# The container has no resolvable FQDN; without this Apache logs a warning on
# every start, which is noise in a log that should stay readable.
ServerName localhost

<Directory /var/www/html>
    # No directory listings. The document root is an unpacked 2005 source tree,
    # and an index of it is an invitation to fetch files that are not entry
    # points. nginx declines this by default; Apache does not.
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# t3lib is a library of includes with no entry points, but it *is* served over
# HTTP for jsfunc.*.js and the Install Tool's verify_imgs/*.gif — so block the
# source rather than the whole directory. Both /t3lib/... and /typo3/t3lib/...
# are used by the backend, hence the optional prefix.
<LocationMatch "^(/typo3)?/t3lib/.*\.(php|sql|inc)$">
    Require all denied
</LocationMatch>

# localconf.php holds the database password. typo3temp and uploads must stay
# readable for generated images, so this filters by extension rather than
# denying the directories outright.
<LocationMatch "^/(typo3conf|typo3temp|uploads|fileadmin)/.*\.(php|sql|inc)$">
    Require all denied
</LocationMatch>
