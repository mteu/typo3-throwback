<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TYPO3 v3.3.0</title>
<style>
  :root {
    --bg: #f4f1ea;
    --bar: #ffffff;
    --text: #23211d;
    --muted: #6b665c;
    --line: #ddd7ca;
    --accent: #c8501e;
    --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1a18;
      --bar: #252320;
      --text: #ece8df;
      --muted: #a39d90;
      --line: #3a3732;
      --accent: #f07a45;
      --error: #f2867e;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 16px;
    padding: 8px 16px;
    background: var(--bar);
    border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0; font-size: 15px; font-weight: 600; white-space: nowrap; }
  nav { display: flex; flex-wrap: wrap; gap: 6px; }
  button, .address {
    font: inherit;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 10px;
  }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  .address {
    flex: 1 1 220px;
    min-width: 0;
    color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .status { color: var(--muted); font-size: 13px; }
  .status.error { color: var(--error); white-space: pre-wrap; }
  .logins { color: var(--muted); font-size: 12px; }
  .logins code { color: var(--text); }
  .links { font-size: 12px; display: flex; align-items: center; gap: 14px; }
  .links a { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); text-decoration: none; }
  .links a:hover, .links a:focus-visible { text-decoration: underline; }
  .links svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .links svg.fill { fill: currentColor; stroke: none; }
  .stage { flex: 1; position: relative; min-height: 0; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  .loader {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: var(--bg);
  }
  .loader[hidden] { display: none; }
  .loader-card { width: min(420px, 100%); }
  .loader-title { margin: 0 0 12px; font-size: 18px; font-weight: 600; }
  .bar { height: 8px; overflow: hidden; border-radius: 4px; background: var(--line); }
  .bar > div { width: 0; height: 100%; background: var(--accent); transition: width 0.3s ease-out; }
  .loader.error .bar > div { background: var(--error); }
  .loader-text { margin: 10px 0 0; min-height: 1.4em; color: var(--muted); }
  .loader.error .loader-text { color: var(--error); white-space: pre-wrap; }
  .loader-note { margin: 16px 0 0; color: var(--muted); font-size: 12px; }
  @media (prefers-reduced-motion: reduce) { .bar > div { transition: none; } }
</style>
</head>
<body>
<header>
  <h1>TYPO3 v3.3.0</h1>
  <nav aria-label="Site">
    <button type="button" data-path="" disabled>Frontend</button>
    <button type="button" data-path="typo3/index.php" data-own-tab disabled title="Opens in a tab of its own. Keep this site open in a tab: that is where PHP runs.">Backend ↗</button>
    <button type="button" data-path="typo3/install/index.php" disabled>Install Tool</button>
  </nav>
  <div class="address" id="address" aria-live="off"></div>
  <button type="button" id="reset" disabled>Reset site</button>
  <div class="status" id="status" role="status">Starting…</div>
  <div class="logins">Backend <code>admin</code> / <code>password</code>, Install Tool <code>joh316</code></div>
  <div class="links">
    <a href="../docs/" title="Documentation" aria-label="Documentation"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg></a>
    <a href="https://github.com/mteu/typo3-throwback" title="Source on GitHub" aria-label="Source on GitHub"><svg class="fill" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg></a>
    <a href="LICENSES.txt" title="Licenses" aria-label="Licenses"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></svg></a>
  </div>
</header>
<div class="stage">
  <iframe id="site" title="TYPO3 v3.3.0"></iframe>
  <div class="loader" id="loader">
    <div class="loader-card">
      <p class="loader-title" id="loader-title">Starting TYPO3 v3.3.0</p>
      <div class="bar" id="bar" role="progressbar" aria-labelledby="loader-title" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="fill"></div></div>
      <p class="loader-text" id="loader-text">Starting…</p>
      <p class="loader-note">The first visit downloads PHP and TYPO3 and sets the site up. Later visits restore it from this browser.</p>
    </div>
  </div>
</div>
<script>
'use strict';
(async () => {
  const status = document.getElementById('status');
  const frame = document.getElementById('site');
  const address = document.getElementById('address');
  const buttons = document.querySelectorAll('nav button');
  const reset = document.getElementById('reset');
  const loader = document.getElementById('loader');
  const loaderText = document.getElementById('loader-text');
  const bar = document.getElementById('bar');
  const fill = document.getElementById('fill');
  const say = (text, isError = false) => {
    status.textContent = text;
    status.classList.toggle('error', isError);
    loaderText.textContent = text;
    loader.classList.toggle('error', isError);
  };
  // Only ever forward, because the worker's stages overlap a little.
  let barFraction = 0;
  const showProgress = fraction => {
    barFraction = Math.max(barFraction, Math.min(Math.max(fraction, 0), 1));
    const percent = Math.round(barFraction * 100);
    fill.style.width = `${percent}%`;
    bar.setAttribute('aria-valuenow', String(percent));
  };

  // Framed by another site, "Reset site" and the backend could be clicked
  // through a decoy (clickjacking). The shell has no reason to be framed.
  if (window.top !== window.self) {
    say('This page does not run inside a frame. Open it in its own tab.', true);
    return;
  }

  if (!('serviceWorker' in navigator)) {
    say('This browser has no service workers, which this page needs.', true);
    return;
  }

  // One tab runs PHP, the one that holds this lock. Two PHP workers would
  // keep two diverging copies of the site and save over each other's
  // snapshot. Every other shell is a follower: sw.js relays its requests to
  // the tab that holds the lock, and the first follower in line takes the
  // lock over when that tab closes, restoring the last snapshot.
  const LOCK = 'typo3-throwback-3.3.0-php';
  const channel = 'BroadcastChannel' in window ? new BroadcastChannel(LOCK) : null;
  let worker = null;
  let uiEnabled = false;

  // sw.js asks every shell with each request for site/. The PHP worker
  // answers on the port the request came with; a follower declines at once.
  navigator.serviceWorker.addEventListener('message', event => {
    if (!event.data || event.data.type !== 'php-request') {
      return;
    }
    const [port] = event.ports;
    if (!worker) {
      port.postMessage({ notLeader: true });
      return;
    }
    const { request } = event.data;
    worker.postMessage({ type: 'request', request }, [port, ...(request.body ? [request.body.buffer] : [])]);
  });
  navigator.serviceWorker.startMessages();

  const startPhp = () => {
    // assemble.sh gives the worker a name with a hash of its content.
    worker = new Worker('php-worker.js');
    return new Promise((resolve, reject) => {
      // A shell cached from before a deploy asks for a worker that is gone.
      worker.addEventListener('error', event => {
        reject(new Error(`the PHP worker stopped: ${event.message || 'it did not load'}. If the site was just updated, reload this page in a few minutes.`));
      });
      worker.addEventListener('message', event => {
        const message = event.data;
        if (message.type === 'progress') {
          say(message.text);
          if (typeof message.fraction === 'number') {
            showProgress(message.fraction);
          }
        } else if (message.type === 'ready') {
          resolve(message);
        } else if (message.type === 'failed') {
          reject(new Error(message.message));
        } else if (message.type === 'reset-done') {
          if (channel) {
            channel.postMessage({ type: 'reload' });
          }
          location.reload();
        }
      });
    });
  };
  if (channel) {
    channel.addEventListener('message', event => {
      if (event.data.type === 'reset' && worker) {
        worker.postMessage({ type: 'reset' });
      } else if (event.data.type === 'reload') {
        location.reload();
      }
    });
  }

  try {
    await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
  } catch (error) {
    say(`Could not start: ${error.message}`, true);
    return;
  }

  const open = path => {
    frame.src = `site/${path}`;
  };
  // 3.3's backend is a frameset that takes itself for the top window: its
  // frames call top.goToModule(), top.content, top.TS and more, in 39 files.
  // In the iframe, top is this page, so the backend gets a window of its own.
  // A shell has to stay open, because the leader's worker runs PHP.
  const backendPath = /\/site\/typo3\/(?!install\/)/;
  const openOwnTab = path => {
    window.open(`site/${path}`, 'typo3-backend');
  };
  frame.addEventListener('load', () => {
    let shown = null;
    try {
      shown = frame.contentWindow.location;
    } catch (error) {
      address.textContent = '';
      return;
    }
    if (backendPath.test(shown.pathname)) {
      say('The backend runs in a tab of its own. Use the Backend button.', true);
      open('');
      return;
    }
    address.textContent = shown.pathname.replace(/^.*?\/site\//, '/') + shown.search;
  });

  const enableUi = () => {
    if (uiEnabled) {
      return;
    }
    uiEnabled = true;
    for (const button of buttons) {
      button.disabled = false;
      button.addEventListener('click', () => {
        if (button.hasAttribute('data-own-tab')) {
          openOwnTab(button.dataset.path);
        } else {
          open(button.dataset.path);
        }
      });
    }
    reset.disabled = false;
    reset.addEventListener('click', () => {
      if (!confirm('Throw away this site\'s database and files, and provision a fresh one?')) {
        return;
      }
      if (worker) {
        worker.postMessage({ type: 'reset' });
      } else if (channel) {
        channel.postMessage({ type: 'reset' });
      }
    });
    showProgress(1);
    loader.hidden = true;
    window.siteReady = true;
    // Only the entry points the iframe shows: an arbitrary path from a link
    // would reach sw.js with this page as its referrer, which is what sw.js
    // trusts. The backend is not one: a tab opened without a click is blocked.
    const entryPoints = [...buttons].filter(button => !button.hasAttribute('data-own-tab')).map(button => button.dataset.path);
    const asked = new URLSearchParams(location.search).get('path');
    open(entryPoints.includes(asked) ? asked : '');
  };

  const lead = async tookOver => {
    try {
      const { restored } = await startPhp();
      say(tookOver ? 'Ready. The tab that ran PHP closed, so this one took over.'
        : restored ? 'Ready. Restored from your last visit.' : 'Ready. Provisioned a fresh site.');
    } catch (error) {
      say(`Could not start: ${error.message}`, true);
      return;
    }
    enableUi();
  };
  // Held until the tab closes, which hands the lock to the next shell.
  const holdForever = () => new Promise(() => {});

  if (!navigator.locks) {
    // Without Web Locks every tab runs PHP, as before.
    await lead(false);
    return;
  }
  navigator.locks.request(LOCK, { ifAvailable: true }, lock => {
    if (lock) {
      lead(false);
      return holdForever();
    }
    say('Ready. PHP runs in another tab of this site, and this one uses it. Keep that tab open, or this one takes over.');
    enableUi();
    navigator.locks.request(LOCK, () => {
      lead(true);
      return holdForever();
    });
    return null;
  });
})();
</script>
</body>
</html>
