; PHP 5.6 settings for the TYPO3 4.0.13 container.
;
; Started from 3.8/php-legacy.ini, because 4.0 is 3.8's kind of
; application on 3.8's PHP: ISO-8859-1 throughout, 312 ereg-family calls, and 156
; mysql_* calls in core.

; 4.0's own entry points set E_ALL ^ E_NOTICE (index.php:42, typo3/init.php:64),
; which on PHP 5.4+ includes E_DEPRECATED and E_STRICT. So display has to be off
; here; the level alone would not keep them out of the HTML.
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT & ~E_NOTICE
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; Load-bearing, and for a reason 3.8's copy of this line never stated.
;
; PHP 5.6 takes htmlspecialchars()'s charset from default_charset when the call
; names none (ext/standard/html.c:1464, get_default_charset()), and 4.0 never names
; one. Under 5.6's own default, UTF-8, an ISO-8859-1 byte such as the ø in Skaarhøj
; is an invalid UTF-8 sequence, and htmlspecialchars() then returns an empty string
; (html.c, php_escape_html_entities_ex(), no ENT_IGNORE or ENT_SUBSTITUTE).
; TCEforms writes every field value through it (t3lib/class.t3lib_tceforms.php:
; 1008), so the record editor would show any title with an umlaut as blank, and
; saving the form would write the blank back. The frontend would look fine.
;
; The typo3-4-0 job runs that failure as a control experiment.
default_charset = "ISO-8859-1"

; Not needed by 4.0, and set anyway. 4.0 has no Ext.Direct and no backend AJAX
; endpoint, so nothing it ships sends the JSON POST that makes 5.6 warn about
; $HTTP_RAW_POST_DATA. -1 costs nothing and keeps the 4.5 lesson from having to
; be relearned if an extension ever does.
always_populate_raw_post_data = -1

max_execution_time = 300
memory_limit = 128M

sendmail_path = /bin/true

session.use_cookies = 1
session.use_only_cookies = 1
session.use_trans_sid = 0

date.timezone = "UTC"
