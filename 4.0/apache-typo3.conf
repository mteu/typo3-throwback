# Apache policy for the TYPO3 4.0.13 container.
#
# The same deny policy as 3.8/apache-typo3.conf, which ports it from
# php4-base/nginx.conf, so a file cannot be protected on one stack and exposed
# on another. 4.5's .log rule is left out: 4.0 has no deprecation log.
# One addition, marked below, is taken from 4.5.

ServerName localhost

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

<LocationMatch "^(/typo3)?/t3lib/.*\.(php|sql|inc)$">
    Require all denied
</LocationMatch>

<LocationMatch "^/(typo3conf|typo3temp|uploads|fileadmin)/.*\.(php|sql|inc)$">
    Require all denied
</LocationMatch>

# One process per connection, because the frozen clock would otherwise hand two
# clients the same session.
#
# 4.0 makes a new session's id as substr(md5(uniqid('').getmypid()), ...)
# (t3lib/class.t3lib_userauth.php:231), and the login challenge the same way
# (typo3/index.php:233). uniqid() is the current time in microseconds, and under
# libfaketime the time does not move, so within one process every call returns
# the same value. Two requests served by the same Apache child therefore get the
# same session id: a fresh, cookieless request can find the session an earlier
# login opened and be logged in as that user. CI's second login hit exactly that
# on a run where it landed on the child that had served the first.
#
# The pid is the other half of the id, and it is the half that still varies. A
# child that serves one connection and exits makes every request a new pid, so
# every id is distinct again while the clock stays frozen for everything the
# stack renders. Forking per request costs nothing a local stack notices; the
# loopback proxy speaks HTTP/1.0 to this container, so a connection is a request.
# Set here rather than in mpm_prefork.conf so it travels with the rest of this
# stack's policy; conf-enabled/ is read after mods-enabled/, so this value wins.
MaxConnectionsPerChild 1

# From 4.5: telling TYPO3 it sits behind TLS.
#
# 4.0 builds every redirect as an absolute URL: t3lib_div::locationHeaderUrl()
# prefixes TYPO3_REQUEST_DIR to any relative target (t3lib/class.t3lib_div.php:
# 2736-2744), and that takes its scheme from TYPO3_SSL (:3155). TYPO3_SSL reads
# $_SERVER['HTTPS'] (:3180). Behind a TLS-terminating proxy, with plain HTTP on
# the hop to this container, every login and every save would otherwise redirect
# to http://.
#
# Unlike 4.5 this needs nothing else. 4.0 has no trustedHostsPattern, so telling
# it about TLS cannot make it refuse its own requests.
#
# Off unless the entrypoint passes -DTYPO3_BEHIND_TLS, because this stack itself
# is plain HTTP on loopback and a redirect to https:// there leads nowhere.
<IfDefine TYPO3_BEHIND_TLS>
    SetEnv HTTPS on
</IfDefine>
