; PHP settings for the TYPO3 4.5.40 container.
;
; Started from 3.8/php-legacy.ini and changed in three places. Each change
; is one that copying the 3.8 file unchanged would have got silently wrong.

; 4.5's bootstrap sets its own level at typo3/init.php:70, but anything PHP emits
; before that line runs is governed by this one.
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT & ~E_NOTICE

; Never in the HTML: an error printed into a page is no longer the page that
; shipped, and in the backend it lands in front of Ext.Direct's JSON.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; Changed from 3.8, which pins ISO-8859-1. 4.5 is UTF-8 end to end, and
; PHP 5.6's own default is already UTF-8. Stated anyway, so that a later copy of
; the 3.8 file is visibly a regression rather than an invisible one.
default_charset = "UTF-8"

; New for 4.5. PHP 5.6 warns that "Automatically populating $HTTP_RAW_POST_DATA is
; deprecated" at request startup for any POST whose body is not a form, which is
; every Ext.Direct call the backend makes
; (t3lib/extjs/class.t3lib_extjs_extdirectrouter.php:49 reads php://input). -1 is
; the setting PHP itself tells you to use: stop populating the variable, which
; nothing in 4.5 reads.
always_populate_raw_post_data = -1

max_execution_time = 300

; Changed from 3.8's 256M to INSTALL.txt's recommended figure. A container's
; memory is the sum over Apache's children, so the figure matters wherever
; the container's memory is capped.
memory_limit = 128M

sendmail_path = /bin/true

session.use_cookies = 1
session.use_only_cookies = 1
session.use_trans_sid = 0

date.timezone = "UTC"
