# Apache policy for the TYPO3 4.5.40 container.
#
# The same deny policy as 3.8/apache-typo3.conf, which ports it from
# php4-base/nginx.conf, so a file cannot be protected on one stack and
# exposed on another. Two additions are specific to 4.5 and marked below.

ServerName localhost

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

<LocationMatch "^(/typo3)?/t3lib/.*\.(php|sql|inc)$">
    Require all denied
</LocationMatch>

# 4.5 addition: log. With enableDeprecationLog at its default of "file"
# (t3lib/config_default.php:104), 4.5 writes typo3conf/deprecation_<hash>.log,
# which carries file system paths and call sites. Nothing needs it over HTTP.
<LocationMatch "^/(typo3conf|typo3temp|uploads|fileadmin)/.*\.(php|sql|inc|log)$">
    Require all denied
</LocationMatch>

# 4.5 addition: telling TYPO3 it sits behind TLS.
#
# 4.5 builds every redirect, and some page content, as an absolute URL whose
# scheme it takes from TYPO3_SSL (t3lib/class.t3lib_div.php:4135, :4165). Behind
# a TLS-terminating proxy, with plain HTTP on the hop to this container, that
# makes http:// URLs inside an https:// page — mixed content the browser blocks.
# HTTPS=on is the input TYPO3_SSL reads, so this is configuration rather than a
# source patch.
#
# Off unless the entrypoint passes -DTYPO3_BEHIND_TLS, because this stack itself
# is plain HTTP on loopback and a redirect to https:// there leads nowhere. CI
# turns it on in a second phase to prove the setting and the consequence for
# trustedHostsPattern.
<IfDefine TYPO3_BEHIND_TLS>
    SetEnv HTTPS on
</IfDefine>
