# Apache policy for the TYPO3 6.2.31 container.
#
# Two sources, merged. The first is the policy every stack here shares (no
# listings, no source served from the writable trees), so a file cannot be
# protected on one stack and exposed on another. The second is new: 6.2 ships its
# own access rules, in _.htaccess at the top of the tarball, and they are ported
# here rather than enabled, because this image reads no .htaccess
# (AllowOverride None, as every stack here) and has no mod_rewrite loaded. Each
# ported rule cites the _.htaccess line it comes from.

ServerName localhost

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# typo3conf/ now holds three PHP files that are configuration, not entry points:
# LocalConfiguration.php (the database password), PackageStates.php and
# AdditionalConfiguration.php. typo3temp/ holds the class loader's PHP cache.
<LocationMatch "^/(typo3conf|typo3temp|uploads|fileadmin)/.*\.(php|sql|inc|log)$">
    Require all denied
</LocationMatch>

# _.htaccess:287-290. Temporary and recycler folders, TypoScript under
# fileadmin/templates, the log directory 6.2's logging framework writes to
# (typo3temp/logs/typo3.log), and every extension's non-public folders.
<LocationMatch "_(recycler|temp)_/">
    Require all denied
</LocationMatch>
<LocationMatch "^/fileadmin/templates/.*\.(txt|ts)$">
    Require all denied
</LocationMatch>
<LocationMatch "^/(typo3/vendor|typo3_src|typo3temp/logs)(/|$)">
    Require all denied
</LocationMatch>
<LocationMatch "/(typo3conf/ext|typo3/sysext|typo3/ext)/[^/]+/(Configuration|Resources/Private|Tests?|Documentation|docs?)/">
    Require all denied
</LocationMatch>

# _.htaccess:294-297: anything whose name starts with a dot, wherever it is.
<LocationMatch "/\.">
    Require all denied
</LocationMatch>

# _.htaccess:313-325, verbatim: files that describe a site rather than serve it.
<FilesMatch "(?i:^\.|^#.*#|^(?:ChangeLog|ToDo|Readme|License)(?:\.md|\.txt)?|^composer\.(?:json|lock)|^ext_conf_template\.txt|^ext_typoscript_constants\.txt|^ext_typoscript_setup\.txt|flexform[^.]*\.xml|locallang[^.]*\.(?:xml|xlf)|\.(?:bak|co?nf|cfg|ya?ml|ts|dist|fla|in[ci]|log|sh|sql(?:\..*)?|sw[op]|git.*)|.*(?:~|rc))$">
    Require all denied
</FilesMatch>

# Loopback only while the installer runs.
#
# On first boot the entrypoint starts Apache in the background so install.php can
# drive 6.2's step installer through it, and passes -DTYPO3_INSTALLING. During
# that window the site has no LocalConfiguration.php yet, so 6.2 counts the
# installation as in progress and the Install Tool asks for no password
# (AbstractController.php, outputLoginFormIfNotAuthorized()). Anything that could
# reach port 80 then could take the installer over. The edge proxy can: the first
# CI run to race it saw a "responding" frontend through the edge mid-install.
#
# A <Location> section is merged after <Directory>, so this Require replaces the
# document root's "all granted" for every path until Apache restarts without the
# define. install.php connects from 127.0.0.1; the edge does not.
<IfDefine TYPO3_INSTALLING>
    <Location />
        Require ip 127.0.0.1
    </Location>
</IfDefine>

# From 4.5: telling TYPO3 it sits behind TLS.
#
# 6.2 builds every redirect as an absolute URL (GeneralUtility::locationHeaderUrl(),
# called by HttpUtility::redirect(), HttpUtility.php:78), with the scheme taken from
# TYPO3_SSL, which reads $_SERVER['HTTPS']. Off unless the entrypoint passes -DTYPO3_BEHIND_TLS, because this stack
# itself is plain HTTP on loopback.
<IfDefine TYPO3_BEHIND_TLS>
    SetEnv HTTPS on
</IfDefine>
