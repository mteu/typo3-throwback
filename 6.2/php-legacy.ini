; PHP settings for the TYPO3 6.2.31 container.
;
; 4.5/php-legacy.ini, whose reasons carry over line for line, with the
; figures INSTALL.md asks for.

error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT & ~E_NOTICE
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; UTF-8, as for 4.5 and the opposite of 3.8 and 4.0. 6.2's data is UTF-8, which
; is what htmlspecialchars() then assumes, so the line agrees with PHP 5.6's own
; default rather than overriding it, and is not load-bearing the way it is for
; 4.0. It is stated so that a copy of the latin1 stacks' file
; is visibly a regression: under ISO-8859-1, 6.2 would escape UTF-8 bytes as if
; they were latin1.
default_charset = "UTF-8"

; 4.5's finding, and 6.2 has the same Ext.Direct router reading php://input
; (typo3/sysext/core/Classes/ExtDirect/ExtDirectRouter.php:35). The typo3-6-2 job
; runs 4.5's three-phase control against it.
always_populate_raw_post_data = -1

; INSTALL.md: "at least 30s (240s recommended)". The installer's environment
; check (Check.php, checkMaxExecutionTime()) recommends the same 240.
max_execution_time = 240

; INSTALL.md: "at least 64M", which is also the installer's floor
; (checkMemorySettings()), and 128M under "Recommended setup".
memory_limit = 128M

sendmail_path = /bin/true

session.use_cookies = 1
session.use_only_cookies = 1
session.use_trans_sid = 0

date.timezone = "UTC"
