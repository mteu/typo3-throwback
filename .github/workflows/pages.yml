# Builds the whole public site and publishes it to GitHub Pages, at
# https://throwback.mteu.cc/. Pages takes one deployment per repository, so every part of the
# site is built here and deployed together:
#
#   /        site/landing/
#   /docs/   site/docs/, built by Zensical
#   /wasm/   what the browser releases share, published once: PHP 4.4.9 built
#            to WebAssembly, sql.js, the runtime, each release's archive
#   /3.3/    TYPO3 3.3.0 in the browser: its shell page and service worker
#   /3.8/    TYPO3 3.8.1 in the browser, the same way
#
# wasm/check.sh checks all of the browser part, headless Chromium included,
# before anything is published, and wasm/site/assemble.sh lays it out.
#
# Each release gets a directory of its own, because each registers a service
# worker for its directory. Nothing at the root, under /docs/ or under /wasm/
# does.
#
# A change to the docs alone rebuilds PHP too, because the deployment needs
# every part. That costs the WebAssembly build's time, once per change.
#
# Publishing rules:
#
#   * Only the default branch of mteu/typo3-throwback deploys. A push to any
#     other branch, or to any other repository such as a fork, runs the same
#     build and checks, and uploads the site as an artifact, so it can be
#     looked at, but publishes nothing. There is no pull_request trigger, as in
#     images.yml: a pull request's branch is already built on push, and a
#     second trigger only builds the same commit twice.
#   * Pages must be set to deploy from GitHub Actions (Settings, Pages, Build
#     and deployment, Source). Until then the deploy job fails and the site is
#     simply not published. In a repository that does not deploy, the job is
#     skipped, whatever its Pages settings say.
#
# Like images.yml, the trigger is an allowlist: the files the site is built,
# checked or assembled from, and this workflow.

name: pages

on:
  push:
    paths:
      - 'wasm/**'
      - 'vendor-src/php-4.4.9/**'
      - 'vendor-src/typo3-3.3.0/**'
      - 'vendor-src/typo3-3.8.1/**'
      - '3.3/provision.php'
      - '3.3/LICENCES.md'
      - '3.8/provision.php'
      - '3.8/LICENCES.md'
      - 'php4-base/php-legacy.ini'
      - 'LICENSE'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# Not named EMSDK_*: emsdk_env.sh clears every variable with that prefix.
env:
  PINNED_EMSDK_VERSION: 7.0.0
  # A moved tag fails the build instead of changing the compiler underneath it.
  PINNED_EMSDK_COMMIT: 1693ce7359fc9694f198694f902a2cc061239b86

jobs:
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install flex and bison
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flex bison

      - name: Install emsdk ${{ env.PINNED_EMSDK_VERSION }}
        run: |
          git clone --depth 1 --branch "$PINNED_EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          test "$(git -C "$RUNNER_TEMP/emsdk" rev-parse HEAD)" = "$PINNED_EMSDK_COMMIT"
          "$RUNNER_TEMP/emsdk/emsdk" install "$PINNED_EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$PINNED_EMSDK_VERSION"

      - name: Install sql.js and Playwright's Chromium
        working-directory: wasm
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Build PHP 4.4.9 to WebAssembly
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          wasm/php-4.4.9/build.sh . "$RUNNER_TEMP/wasm/php-4.4.9"

      # Ends by assembling the site and driving it in Chromium.
      - name: Run every check, the site in a browser included
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          wasm/check.sh . "$RUNNER_TEMP/wasm"

      - uses: actions/upload-artifact@v7
        with:
          name: wasm-site
          path: ${{ runner.temp }}/wasm/site
          if-no-files-found: error

  # --strict: a broken link or a page missing from the navigation fails the build, not the published site.
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: site/requirements.txt

      - run: pip install -r site/requirements.txt

      - name: Build the documentation
        working-directory: site
        run: zensical build --clean --strict

      - uses: actions/upload-artifact@v7
        with:
          name: docs
          path: site/build/docs
          if-no-files-found: error

  assemble:
    needs: [wasm, docs]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # wasm/ and one directory per release, at the root.
      - uses: actions/download-artifact@v8
        with:
          name: wasm-site
          path: ${{ runner.temp }}/pages

      - uses: actions/download-artifact@v8
        with:
          name: docs
          path: ${{ runner.temp }}/pages/docs

      # The front page last, so that a file of its own can never be overwritten
      # by a build, and a build's directory never by the front page.
      - name: Lay out the site
        run: |
          set -euo pipefail
          pages="$RUNNER_TEMP/pages"
          for name in $(ls -A site/landing); do
            if [ -e "$pages/$name" ]; then
              echo "::error::site/landing/$name collides with a built directory"
              exit 1
            fi
          done
          cp -r site/landing/. "$pages/"
          # Only a release may register a service worker, and only in its own
          # directory.
          if find "$pages" "$pages/wasm" -maxdepth 1 -name 'sw*.js' | grep -q .; then
            echo "::error::a service worker at the root or in wasm/ would control pages it must not"
            exit 1
          fi
          test -f "$pages/index.html"
          test -f "$pages/docs/index.html"
          for release in 3.3 3.8; do
            test -f "$pages/$release/index.html"
            test -f "$pages/$release/sw.js"
          done
          test -f "$pages/wasm/LICENSES.txt"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    needs: assemble
    if: github.repository == 'mteu/typo3-throwback' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # A deploy is never cancelled halfway; a newer one waits for it.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
