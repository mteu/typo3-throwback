# Builds the whole public site and publishes it to GitHub Pages, at
# https://throwback.mteu.cc/. Pages takes one deployment per repository, so every part of the
# site is built here and deployed together:
#
#   /        site/landing/
#   /docs/   site/docs/, built by Zensical
#   /3.3/    TYPO3 3.3.0 in the browser: PHP 4.4.9 built to WebAssembly, and
#            checked by php4-wasm/check.sh, headless Chromium included, before
#            anything is published
#
# Each browser build gets a directory of its own, because each registers a
# service worker for its directory. Nothing at the root or under /docs/ does.
#
# A change to the docs alone rebuilds PHP too, because the deployment needs
# every part. That costs the WebAssembly build's time, once per change.
#
# Publishing rules:
#
#   * Only the default branch deploys. A push to any other branch runs the
#     same build and checks, and uploads the site as an artifact, so it can be
#     looked at, but publishes nothing. There is no pull_request trigger, as in
#     images.yml: a pull request's branch is already built on push, and a
#     second trigger only builds the same commit twice.
#   * Pages must be set to deploy from GitHub Actions (Settings, Pages, Build
#     and deployment, Source). Until then the deploy job fails and the site is
#     simply not published.
#
# Like images.yml, the trigger is an allowlist: the files the site is built,
# checked or assembled from, and this workflow.

name: pages

on:
  push:
    paths:
      - 'php4-wasm/**'
      - 'vendor-src/php-4.4.9/**'
      - 'vendor-src/typo3-3.3.0/**'
      - '3.3/provision.php'
      - 'php4-base/php-legacy.ini'
      - 'LICENSE'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# Not named EMSDK_*: emsdk_env.sh clears every variable with that prefix.
env:
  PINNED_EMSDK_VERSION: 7.0.0
  # A moved tag fails the build instead of changing the compiler underneath it.
  PINNED_EMSDK_COMMIT: 1693ce7359fc9694f198694f902a2cc061239b86

jobs:
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install flex and bison
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flex bison

      - name: Install emsdk ${{ env.PINNED_EMSDK_VERSION }}
        run: |
          git clone --depth 1 --branch "$PINNED_EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          test "$(git -C "$RUNNER_TEMP/emsdk" rev-parse HEAD)" = "$PINNED_EMSDK_COMMIT"
          "$RUNNER_TEMP/emsdk/emsdk" install "$PINNED_EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$PINNED_EMSDK_VERSION"

      - name: Install sql.js and Playwright's Chromium
        working-directory: php4-wasm
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Build PHP 4.4.9 to WebAssembly
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          php4-wasm/build.sh . "$RUNNER_TEMP/php4wasm"

      # Ends by assembling the site and driving it in Chromium.
      - name: Run every check, the site in a browser included
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          php4-wasm/check.sh . "$RUNNER_TEMP/php4wasm"

      - uses: actions/upload-artifact@v7
        with:
          name: wasm-3.3
          path: ${{ runner.temp }}/php4wasm/out/site
          if-no-files-found: error

  # --strict: a broken link or a page missing from the navigation fails the build, not the published site.
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: site/requirements.txt

      - run: pip install -r site/requirements.txt

      - name: Build the documentation
        working-directory: site
        run: zensical build --clean --strict

      - uses: actions/upload-artifact@v7
        with:
          name: docs
          path: site/build/docs
          if-no-files-found: error

  assemble:
    needs: [wasm, docs]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: docs
          path: ${{ runner.temp }}/pages/docs

      - uses: actions/download-artifact@v8
        with:
          name: wasm-3.3
          path: ${{ runner.temp }}/pages/3.3

      # The front page last, so that a file of its own can never be overwritten
      # by a build, and a build's directory never by the front page.
      - name: Lay out the site
        run: |
          set -euo pipefail
          pages="$RUNNER_TEMP/pages"
          for name in $(ls -A site/landing); do
            if [ -e "$pages/$name" ]; then
              echo "::error::site/landing/$name collides with a built directory"
              exit 1
            fi
          done
          cp -r site/landing/. "$pages/"
          # Only a browser build may register a service worker, and only in
          # its own directory.
          if find "$pages" -maxdepth 1 -name 'sw*.js' | grep -q .; then
            echo "::error::a service worker at the root would control every page"
            exit 1
          fi
          test -f "$pages/index.html"
          test -f "$pages/docs/index.html"
          test -f "$pages/3.3/index.html"
          test -f "$pages/3.3/sw.js"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    needs: assemble
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # A deploy is never cancelled halfway; a newer one waits for it.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
