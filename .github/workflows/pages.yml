# Builds the whole public site and publishes it to GitHub Pages, at
# https://throwback.mteu.cc/. Pages takes one deployment per repository, so every part of the
# site is built here and deployed together:
#
#   /        site/landing/
#   /docs/   site/docs/, built by Zensical
#   /wasm/   what the browser releases share, published once: each PHP a
#            release names, built to WebAssembly (PHP 4.4.9 and 5.6.40 are
#            built and checked), sql.js, the runtime, each release's archive
#   /3.3/    TYPO3 3.3.0 in the browser: its shell page and service worker
#   /3.8/    TYPO3 3.8.1 in the browser, the same way
#   /4.0/    TYPO3 4.0.13 in the browser, the same way
#   /4.5/    TYPO3 4.5.40 in the browser, the same way, on PHP 5.6.40
#   /6.2/    TYPO3 6.2.31 in the browser, the same way, on PHP 5.6.40, set up
#            in the tab by its own installer on the first visit
#
# wasm/check.sh checks all of the browser part, headless Chromium included,
# before anything is published, and wasm/site/assemble.sh lays it out.
#
# Each release gets a directory of its own, because each registers a service
# worker for its directory. Nothing at the root, under /docs/ or under /wasm/
# does.
#
# The deployment needs every part, so every run assembles the whole site, but
# it spends time only on what changed:
#
#   * Each PHP build is cached under a hash of its own inputs: its directory in
#     wasm/, wasm/native/, its vendored sources and the pinned emsdk. A change
#     to PHP 4 rebuilds PHP 4 and restores PHP 5, and the other way round. A
#     branch restores what the default branch cached; the default branch
#     builds once after a merge that changed a build's inputs.
#   * check.sh runs when a file it reads changed, when a build was not
#     restored from the cache, or on a manual run. A change to site/ alone
#     builds the docs and lays out the site from the cached builds, without
#     the checks: nothing they test has changed since they last passed.
#
# Publishing rules:
#
#   * Only the default branch of mteu/typo3-throwback deploys. A push to any
#     other branch, or to any other repository such as a fork, runs the same
#     build and checks, and uploads the site as an artifact, so it can be
#     looked at, but publishes nothing. There is no pull_request trigger, as in
#     images.yml: a pull request's branch is already built on push, and a
#     second trigger only builds the same commit twice.
#   * Pages must be set to deploy from GitHub Actions (Settings, Pages, Build
#     and deployment, Source). Until then the deploy job fails and the site is
#     simply not published. In a repository that does not deploy, the job is
#     skipped, whatever its Pages settings say.
#
# Like images.yml, the trigger is an allowlist: the files the site is built,
# checked or assembled from, and this workflow.

name: pages

on:
  push:
    paths:
      - 'wasm/**'
      - 'vendor-src/php-4.4.9/**'
      - 'vendor-src/php-5.6.40/**'
      - 'vendor-src/libxml2-2.9.14/**'
      - 'vendor-src/openssl-1.0.2u/**'
      - 'vendor-src/typo3-3.3.0/**'
      - 'vendor-src/typo3-3.8.1/**'
      - 'vendor-src/typo3-4.0.13/**'
      - 'vendor-src/typo3-4.5.40/**'
      - 'vendor-src/typo3-6.2.31/**'
      - '3.3/provision.php'
      - '3.3/LICENCES.md'
      - '3.8/provision.php'
      - '3.8/php-legacy.ini'
      - '3.8/LICENCES.md'
      - '4.0/provision.php'
      - '4.0/LICENCES.md'
      - '4.5/provision.php'
      - '4.5/php-legacy.ini'
      - '4.5/LICENCES.md'
      - '6.2/provision.php'
      - '6.2/php-legacy.ini'
      - '6.2/LICENCES.md'
      - 'php4-base/php-legacy.ini'
      - 'LICENSE'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# Not named EMSDK_*: emsdk_env.sh clears every variable with that prefix.
env:
  PINNED_EMSDK_VERSION: 7.0.0
  # A moved tag fails the build instead of changing the compiler underneath it.
  PINNED_EMSDK_COMMIT: 1693ce7359fc9694f198694f902a2cc061239b86

jobs:
  # Whether a file check.sh reads changed: the trigger's list without site/.
  # The PHP builds need no such gate, because their cache keys are hashes of
  # their inputs.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      checks: ${{ steps.filter.outputs.checks == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # As in images.yml: compare with the commit before the push, not with
          # the default branch.
          base: ${{ github.ref_name }}
          filters: |
            checks:
              - 'wasm/**'
              - 'vendor-src/php-4.4.9/**'
              - 'vendor-src/php-5.6.40/**'
              - 'vendor-src/libxml2-2.9.14/**'
              - 'vendor-src/openssl-1.0.2u/**'
              - 'vendor-src/typo3-3.3.0/**'
              - 'vendor-src/typo3-3.8.1/**'
              - 'vendor-src/typo3-4.0.13/**'
              - 'vendor-src/typo3-4.5.40/**'
              - 'vendor-src/typo3-6.2.31/**'
              - '3.3/provision.php'
              - '3.3/LICENCES.md'
              - '3.8/provision.php'
              - '3.8/php-legacy.ini'
              - '3.8/LICENCES.md'
              - '4.0/provision.php'
              - '4.0/LICENCES.md'
              - '4.5/provision.php'
              - '4.5/php-legacy.ini'
              - '4.5/LICENCES.md'
              - '6.2/provision.php'
              - '6.2/php-legacy.ini'
              - '6.2/LICENCES.md'
              - 'php4-base/php-legacy.ini'
              - 'LICENSE'
              - '.github/workflows/pages.yml'

  wasm:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      # Only out/ is kept: check.sh and assemble.sh read nothing else of a
      # build's work dir.
      - name: Restore PHP 4.4.9
        id: php4
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/wasm/php-4.4.9/out
          key: wasm-php-4.4.9-${{ runner.os }}-${{ env.PINNED_EMSDK_COMMIT }}-${{ hashFiles('wasm/php-4.4.9/**', 'wasm/native/**', 'vendor-src/php-4.4.9/**') }}

      - name: Restore PHP 5.6.40
        id: php5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/wasm/php-5.6.40/out
          key: wasm-php-5.6.40-${{ runner.os }}-${{ env.PINNED_EMSDK_COMMIT }}-${{ hashFiles('wasm/php-5.6.40/**', 'wasm/native/**', 'vendor-src/php-5.6.40/**', 'vendor-src/libxml2-2.9.14/**', 'vendor-src/openssl-1.0.2u/**') }}

      # A fresh build is checked even when no file check.sh reads changed, so
      # that nothing reaches the site that check.sh has not seen.
      - name: Decide what to build and check
        id: plan
        env:
          PHP4_HIT: ${{ steps.php4.outputs.cache-hit }}
          PHP5_HIT: ${{ steps.php5.outputs.cache-hit }}
          CHECKS: ${{ needs.changes.outputs.checks }}
        run: |
          build=false
          if [ "$PHP4_HIT" != true ] || [ "$PHP5_HIT" != true ]; then build=true; fi
          check=$CHECKS
          if [ "$build" = true ]; then check=true; fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "check=$check" >> "$GITHUB_OUTPUT"

      - name: Install flex and bison
        if: steps.plan.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flex bison

      # check.sh needs it too: it sources emsdk_env.sh.
      - name: Install emsdk ${{ env.PINNED_EMSDK_VERSION }}
        if: steps.plan.outputs.check == 'true'
        run: |
          git clone --depth 1 --branch "$PINNED_EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          test "$(git -C "$RUNNER_TEMP/emsdk" rev-parse HEAD)" = "$PINNED_EMSDK_COMMIT"
          "$RUNNER_TEMP/emsdk/emsdk" install "$PINNED_EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$PINNED_EMSDK_VERSION"

      - name: Install sql.js
        working-directory: wasm
        run: npm ci --no-audit --no-fund

      - name: Install Playwright's Chromium
        if: steps.plan.outputs.check == 'true'
        working-directory: wasm
        run: npx playwright install --with-deps chromium

      - name: Build PHP 4.4.9 to WebAssembly
        if: steps.php4.outputs.cache-hit != 'true'
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          wasm/php-4.4.9/build.sh . "$RUNNER_TEMP/wasm/php-4.4.9"

      - name: Cache PHP 4.4.9
        if: steps.php4.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/wasm/php-4.4.9/out
          key: ${{ steps.php4.outputs.cache-primary-key }}

      # The site runs 4.5.40 and 6.2.31 on it. check.sh also probes its CLI
      # and request loop, and lints both with it.
      - name: Build PHP 5.6.40 to WebAssembly
        if: steps.php5.outputs.cache-hit != 'true'
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          wasm/php-5.6.40/build.sh . "$RUNNER_TEMP/wasm/php-5.6.40"

      - name: Cache PHP 5.6.40
        if: steps.php5.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/wasm/php-5.6.40/out
          key: ${{ steps.php5.outputs.cache-primary-key }}

      # Ends by assembling the site and driving it in Chromium.
      - name: Run every check, the site in a browser included
        if: steps.plan.outputs.check == 'true'
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          wasm/check.sh . "$RUNNER_TEMP/wasm"

      # What check.sh ends with, for a run that has nothing new to check.
      - name: Lay out the browser part of the site
        if: steps.plan.outputs.check != 'true'
        run: |
          releases=()
          for file in wasm/releases/*.js; do
            releases+=("$(basename "$file" .js)")
          done
          wasm/site/assemble.sh . "$RUNNER_TEMP/wasm" "${releases[@]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wasm-site
          path: ${{ runner.temp }}/wasm/site
          if-no-files-found: error

  # --strict: a broken link or a page missing from the navigation fails the build, not the published site.
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: site/requirements.txt

      - run: pip install -r site/requirements.txt

      - name: Build the documentation
        working-directory: site
        run: zensical build --clean --strict

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs
          path: site/build/docs
          if-no-files-found: error

  assemble:
    needs: [wasm, docs]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # wasm/ and one directory per release, at the root.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: wasm-site
          path: ${{ runner.temp }}/pages

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: docs
          path: ${{ runner.temp }}/pages/docs

      # The front page last, so that a file of its own can never be overwritten
      # by a build, and a build's directory never by the front page.
      - name: Lay out the site
        run: |
          set -euo pipefail
          pages="$RUNNER_TEMP/pages"
          for name in $(ls -A site/landing); do
            if [ -e "$pages/$name" ]; then
              echo "::error::site/landing/$name collides with a built directory"
              exit 1
            fi
          done
          cp -r site/landing/. "$pages/"
          # Only a release may register a service worker, and only in its own
          # directory.
          if find "$pages" "$pages/wasm" -maxdepth 1 -name 'sw*.js' | grep -q .; then
            echo "::error::a service worker at the root or in wasm/ would control pages it must not"
            exit 1
          fi
          test -f "$pages/index.html"
          test -f "$pages/docs/index.html"
          for release in 3.3 3.8 4.0 4.5 6.2; do
            test -f "$pages/$release/index.html"
            test -f "$pages/$release/sw.js"
          done
          test -f "$pages/wasm/LICENSES.txt"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    needs: assemble
    if: github.repository == 'mteu/typo3-throwback' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # A deploy is never cancelled halfway; a newer one waits for it.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
