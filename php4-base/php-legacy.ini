; PHP 4.4.9 settings for the pre-PHP-5 containers.
;
; Era-level companion to 3.8/php-legacy.ini, which does the same job for
; PHP 5.6. Read at runtime from /opt/php4/lib/php.ini, matching the --prefix the
; binaries were configured with.

[PHP]
engine = On
expose_php = Off

; $HTTP_SERVER_VARS must be populated: TYPO3's PATH_site detection reads
; $HTTP_SERVER_VARS["PATH_TRANSLATED"] directly (see nginx.conf). "S" is in the
; default order already, but this stack breaks in confusing ways without it, so
; it is pinned rather than inherited.
variables_order = "EGPCS"

; TYPO3 3.x does not need register_globals — it reads $HTTP_*_VARS explicitly.
; The Install Tool flags this as a warning, which is expected and safe to ignore;
; its own comment text says "TYPO3 is designed to cope with that - actually we
; encourage that setting". The bundled phpMyAdmin 2.2.6 tools module is the one
; component that wants it, and it is not needed to run the CMS.
register_globals = Off

; Both entry points call t3lib_div::addSlashesOnArray() when magic quotes are
; off, so TYPO3 normalises the input either way and Off is the safer choice.
magic_quotes_gpc = Off
magic_quotes_runtime = Off

; PHP 4 defaults to an 8M limit, which the backend's record editing and the
; Install Tool's image tests overrun. Matches the headroom 3.8 gives 5.6.
memory_limit = 64M
max_execution_time = 300
max_input_time = 300

post_max_size = 32M
upload_max_filesize = 32M
file_uploads = On

; Fidelity, not convenience — same reasoning as 3.8/php-legacy.ini.
; Anything PHP prints into the response is baked into the rendered page, so display
; stays off and logging stays on so real errors remain diagnosable. TYPO3 narrows
; error_reporting to E_ALL & ~E_NOTICE itself on every request anyway.
error_reporting = E_ALL & ~E_NOTICE
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; Must stay 0, and this is load-bearing.
;
; With fix_pathinfo on, the CGI SAPI derives PATH_INFO/PATH_TRANSLATED itself and
; *unsets* PATH_TRANSLATED when a request has no trailing path info — which
; deletes exactly the variable nginx sets for TYPO3's PATH_site detection (see
; nginx.conf). The frontend survives that by accident, because its relative
; includes still resolve against the CGI working directory, but the backend
; computes PATH_typo3 from PATH_thisScript and dies with "sitepath not specified
; correctly" followed by a phpinfo() dump.
;
; With it off, PHP passes the SCRIPT_FILENAME/PATH_TRANSLATED nginx sends through
; untouched, which is what these stacks want.
cgi.fix_pathinfo = 0

; No mail from a container.
sendmail_path = /bin/true

; Deterministic session handling — session ids leak into rendered URLs otherwise.
session.save_handler = files
session.save_path = /tmp
session.use_cookies = 1
session.use_only_cookies = 1
session.use_trans_sid = 0
session.gc_maxlifetime = 86400

default_socket_timeout = 60
allow_url_fopen = On

; 3.x backends assume ISO-8859-1, matching the latin1 database server the
; stacks pin. t3lib_db never issues SET NAMES, so the two must be aligned by
; configuration — same requirement 3.8 documents for 5.6.
default_charset = "ISO-8859-1"

; PHP 4 has no date.timezone setting (it arrived in 5.1); the container clock is
; UTC and is frozen by libfaketime from the stack's compose file.
