# nginx front end for the PHP 4 FastCGI listener.
#
# Era-level, not version-level: every TYPO3 3.x release predates URL rewriting
# and lays its document root out the same way, so this file is shared by all the
# stacks built on php4-base rather than duplicated per version.
#
# PHP 4 has no FPM, so each stack's entrypoint spawns the cgi-fcgi SAPI
# on 127.0.0.1:9000 and nginx proxies to it.

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    # The document root is built from symlinks into the frozen source tree under
    # /opt, so nginx must be willing to follow them.
    disable_symlinks off;

    client_max_body_size 32m;

    # --- deny rules ---------------------------------------------------------
    # nginx tests regex locations in source order and stops at the first match,
    # so these must precede the \.php$ handler below or they would never apply
    # to the very files they are meant to protect.

    # t3lib is a library of includes with no entry points, but it *is* served
    # over HTTP for jsfunc.*.js and the Install Tool's verify_imgs/*.gif — so
    # block the source rather than the whole directory. Both /t3lib/... and
    # /typo3/t3lib/... resolve here (the backend uses each in different places).
    location ~ ^(/typo3)?/t3lib/.*\.(php|sql|inc)$ {
        deny all;
    }

    # localconf.php holds the database password. Extensions did not arrive until
    # 3.5, so nothing under typo3conf is a legitimate entry point on 3.3.
    # typo3temp and uploads must stay readable for generated images, hence the
    # extension filter rather than a blanket deny.
    location ~ ^/(typo3conf|typo3temp|uploads|fileadmin)/.*\.(php|sql|inc)$ {
        deny all;
    }

    # --- request handling ---------------------------------------------------
    # TYPO3 3.x predates URL rewriting: the frontend is index.php?id=<uid> and
    # the backend is a tree of real .php files, so static-then-404 is enough.
    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_read_timeout 300s;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # This one line is what makes TYPO3 3.x work under FastCGI at all.
        #
        # Both entry points (tslib/index_ts.php and typo3/init.php) derive
        # PATH_site like this:
        #
        #   php_sapi_name()=="cgi" ? getenv("PATH_TRANSLATED") ?: getenv("SCRIPT_FILENAME")
        #                          : $HTTP_SERVER_VARS["PATH_TRANSLATED"]
        #
        # Our SAPI reports "cgi-fcgi", not "cgi", so the comparison is false and
        # TYPO3 falls through to PATH_TRANSLATED — which nginx does not send by
        # default. Without it PATH_site resolves to "/" and the frontend dies
        # with "Cannot find configuration", while the backend dumps phpinfo().
        #
        # This only works together with cgi.fix_pathinfo=0 in php-legacy.ini,
        # which stops the CGI SAPI deleting the variable again. Setting both
        # fixes the frontend and the backend without patching a single TYPO3
        # file, which is what keeps the rendered pixels genuine.
        fastcgi_param PATH_TRANSLATED $document_root$fastcgi_script_name;
    }
}
